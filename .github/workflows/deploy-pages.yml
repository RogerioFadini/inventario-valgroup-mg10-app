name: Deploy site no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Injetar chave da Cloud Vision API
        env:
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
        run: |
          if [ -n "$VISION_API_KEY" ]; then
            sed -i "s|__VISION_API_KEY__|$VISION_API_KEY|g" www/index.html
          fi

      - name: Upload do site (pasta www/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
