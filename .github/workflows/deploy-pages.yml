name: Deploy site no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build e deploy em jobs separados (modelo oficial do GitHub Pages): com os dois
  # no mesmo job, o deploy às vezes procurava o pacote antes de o GitHub
  # registrá-lo ("No artifacts named github-pages were found") e falhava.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Injetar chave da Cloud Vision API
        env:
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
        run: |
          if [ -n "$VISION_API_KEY" ]; then
            sed -i "s|__VISION_API_KEY__|$VISION_API_KEY|g" www/index.html
          fi

      # Lista de arquivos + SHA-256 que o app Android usa para se atualizar sozinho
      # (ver prepararAtualizacaoAndroid em index.html). Fica DEPOIS da injeção da
      # chave, para o hash do index.html bater com o que o site serve.
      - name: Gerar version.json (atualização automática do Android)
        run: |
          python3 - <<'EOF'
          import hashlib, json, os
          arquivos = []
          for raiz, _dirs, nomes in os.walk("www"):
              for nome in nomes:
                  caminho = os.path.join(raiz, nome)
                  rel = os.path.relpath(caminho, "www").replace(os.sep, "/")
                  if rel == "version.json":
                      continue
                  with open(caminho, "rb") as f:
                      dados = f.read()
                  arquivos.append({"path": rel, "sha256": hashlib.sha256(dados).hexdigest(), "tamanho": len(dados)})
          arquivos.sort(key=lambda a: a["path"])
          with open("www/version.json", "w", encoding="utf-8") as f:
              json.dump({"versao": os.environ["GITHUB_SHA"], "arquivos": arquivos}, f, ensure_ascii=False, indent=1)
          print(f"version.json: {len(arquivos)} arquivos, versão {os.environ['GITHUB_SHA'][:7]}")
          EOF

      - name: Upload do site (pasta www/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
